 const lab={off:'경보가 꺼져 있던 때',shock:'충격형 경보가 켜졌던 때',slump:'침체형 경보가 켜졌던 때'}[st];
 $('#one').innerHTML=`<div class="card" style="margin-top:12px"><h2 style="margin:0">${x.g}</h2><p class="sub" style="margin:2px 0 0">${SDN[x.s]} · 시·군·구 단위 판단</p>
 <div class="vd"><span class="pill ${x.on?'hold':'buy'}">${x.on?'매수 보류':'매수'}</span></div>
 <p class="sub" style="margin:2px 0 0">${v.shock?'충격형 경보: 시장 금리 급등과 거래 급감이 함께 나타났어요':v.slump?'침체형 경보: 매수 심리가 바닥권이고 주택담보대출 증가가 둔화됐어요':(c1||c2||c3||c4)?'경보 조건 일부만 켜져 있어요 — 같은 유형 두 조건이 함께 켜질 때만 보류':'켜진 경보 조건이 없어요'}</p>
 ${v.heat?heatBox(x):''}
 <div class="sec">${lab} · 과거 실제 결과(2012년~ 수도권 ${Ds.y12.n.toLocaleString()}건)</div>
 <div class="rk" style="margin-top:6px"><div><div class="h">6개월 뒤 하락</div><div class="n">${Ds.y6.drop}%</div><div class="s">가운데 ${sg(Ds.y6.p50)} · ${sg(Ds.y6.p10)} ~ ${sg(Ds.y6.p90)}</div></div>
 <div><div class="h">12개월 뒤 하락</div><div class="n">${Ds.y12.drop}%</div><div class="s">가운데 ${sg(Ds.y12.p50)} · ${sg(Ds.y12.p10)} ~ ${sg(Ds.y12.p90)}</div></div></div>
 <p class="sub" style="margin:4px 0 0">범위는 10번 중 8번이 들어간 구간 · 전세보다 보류가 나았던 비율 ${Ds.hold_better}%</p>
 <div class="sec">충격형 · 둘 다 켜지면 보류</div><div class="why">
  <div class="w"><div><b>시장 금리 급등</b><span class="fx">국고채 3년 ${v.ktb_now.toFixed(2)}% · 1년 ${v.ktb>=0?'+':'−'}${Math.abs(v.ktb).toFixed(2)}%p · 문턱 +0.5%p</span></div>${on(c1)}</div>
  <div class="w"><div><b>거래 급감</b><span class="fx">최근 3개월 거래 평소의 ${v.vr.toFixed(2)}배 · 문턱 ${v.vth!=null?v.vth.toFixed(2)+'배 이하':'-'}(이 지역 역사 하위 10%)</span></div>${on(c2)}</div></div>
 <div class="sec">침체형 · 둘 다 켜지면 보류</div><div class="why">
  <div class="w"><div><b>매수 심리 바닥권</b><span class="fx">KB 매수우위지수 ${v.sr} ${v.se!=null?Math.round(v.se):'-'} · 문턱 ${v.seth!=null?Math.round(v.seth)+' 이하':'-'}(역사 하위 20%)</span></div>${on(c3)}</div>
  <div class="w"><div><b>주택담보대출 증가 둔화</b><span class="fx">${v.lr} 잔액 1년 ${v.lny!=null?sg(v.lny):'-'} · 문턱 ${v.lnyth!=null?sg(v.lnyth)+' 이하':'-'}(역사 하위 20%)</span></div>${on(c4)}</div></div>
 ${ci!=null?hurdle(ci):''}
 <div class="sec">${x.g} 경보와 실제 시세</div>${hist(x)}
 <p class="sub" style="margin:6px 0 0">${S.n?`2012년 이후 경보 ${S.n}개월 · 그 뒤 12개월 보류가 나았던 비율 ${S.hb}% · 그 뒤 12개월 가운데 ${sg(S.y)}`:'2012년 이후 이 지역에서 경보가 켜진 적이 없어요'}</p></div>`;
 window.scrollTo(0,$('#one').offsetTop-70);}
function heatBox(x){const E=D.VAL.heat_ep.filter(e=>e.gu>=5);
 return `<div class="sec">과열 주의 · 보류 판정에는 넣지 않았어요</div>
 <p class="sub" style="margin:2px 0 6px">${x.g} 1년 ${sg(x.v.r12)} · 국고채 3년 1년 +${x.v.ktb.toFixed(2)}%p. 같은 조합(1년 +20% 이상 + 시장 금리 +0.5%p 이상)이 있었던 해와 그 뒤 1년 실제:</p>
 ${E.map(e=>`<div class="gl"><span>${e.y}년 <span class="sub">${e.gu}곳</span></span><span class="num" style="color:${e.p50<0?'var(--red)':'var(--green)'}">${sg(e.p50)} <span class="sub">하락 ${e.drop}%</span></span></div>`).join('')}
 <p class="sub" style="margin:6px 0 0">크게 하락한 해(2008·2021~22)와 더 오른 해(2007·2018)가 반반이라 보류 근거로 쓰기엔 부족해요. 판단은 아래 경보 조건으로만 해요.</p>`;}
function hurdle(ci){const rs=D.R.filter(r=>r[0]===ci);if(!rs.length)return '';const r=rs.reduce((a,b)=>Math.abs(b[1]-84)<Math.abs(a[1]-84)?b:a),c=D.C[ci],diff=r[5]-r[6];
 return `<div class="sec">${c[0]} ${r[1]}㎡ · 전세 대비 손익분기</div>
 <div class="rk" style="margin-top:6px"><div><div class="h">1년에 이만큼 올라야</div><div class="n">${r[3].toFixed(1)}%</div><div class="s">시세 약 ${eok(r[2])} 기준</div></div><div><div class="h">매수가 더 드는 돈</div><div class="n" style="font-size:1.3rem">${man(diff)}</div><div class="s">1년, 전세 대비</div></div></div>
 <div class="gl"><span>매수 1년 비용 <span class="sub">대출 ${eok(r[4])} 이자 · 자기자본 예금 이자 · 보유세 ${man(r[7])}</span></span><span class="num">${man(r[5])}</span></div>
 <div class="gl"><span>전세 1년 비용 <span class="sub">전세금 ${eok(r[8])}</span></span><span class="num">${man(r[6])}</span></div>`;}
function hist(x){const I=x.idx;if(!I)return '';const S={};x.rec.forEach(r=>S[r[0]]=r[1]?2:1);
 const W=340,H=150,n=I.length,lo=Math.min(...I)*0.95,hi=Math.max(...I)*1.03,X=i=>30+i/(n-1)*(W-40),Y=v=>H-20-(v-lo)/(hi-lo)*(H-34),bw=(W-40)/(n-1)+0.4;
 let bars='';for(let i=0;i<n;i++){const s=S[D.t0+i];if(s)bars+=`<rect x="${X(i)}" y="8" width="${bw}" height="${H-28}" fill="${s===2?'var(--red)':'var(--amber)'}" opacity=".4"/>`;}
 let yrs='';for(let yy=2012;yy<=2026;yy+=2){const i=yy*12-D.t0;yrs+=`<text x="${X(i)}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--ink3)">${String(yy).slice(2)}</text>`;}
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bars}<path d="${I.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--blue)" stroke-width="2"/>${yrs}
 <text x="2" y="${Y(I[0])+4}" font-size="10" fill="var(--ink3)">100</text><text x="2" y="${Y(I[n-1])+4}" font-size="10" fill="var(--ink3)">${Math.round(I[n-1])}</text></svg>
 <div class="lg"><span><i style="background:var(--blue)"></i>구 실거래 시세(2012.01=100)</span><span><i style="background:var(--red);opacity:.5"></i>충격형</span><span><i style="background:var(--amber);opacity:.5"></i>침체형</span></div>`;}
// ---------- 과거 검증 ----------
function valid(){const V=D.VAL,TY=V.types,el=$('#v1'),F=TY['둘 중 하나(국고채)'];
 const row=(nm,s1,s2)=>`<div class="gl"><span>${nm}</span><span class="num">${s1?sg2(s1.gain):'-'} · ${s2?sg2(s2.gain):'-'}</span></div>`;
 const yrs=Object.keys(F.year).sort();
 el.innerHTML=`<h1>과거 검증</h1><p class="lead">시세 추세와 학습 모델은 쓰지 않았어요. 구마다 보류가 나았던 달을 먼저 정하고, 지표들이 그 달을 얼마나 정확히 짚었는지 셈했어요</p>
 <div class="card"><div class="sec" style="margin-top:0">정답 · 보류가 나았던 달</div>
 <p class="sub" style="margin-top:4px">1년 뒤 구 실거래 시세 변화가 전세 대비 손익분기(그때의 대출 규제·금리·보유세로 셈, 연 1~2%)보다 낮았던 달이에요. 2012~2025년 전체 ${V.base.all}% · 2012~2019년 ${V.base.tr}% · 2020년~ ${V.base.te}%</p></div>
 <div class="card"><div class="sec" style="margin-top:0">채택 경보 · 충격형 또는 침체형</div>
 <div class="rk" style="margin-top:6px"><div><div class="h">2012~2019 경보 적중</div><div class="n">${F.tr.prec}%</div><div class="s">기본 ${V.base.tr}% · 초과 성과 ${sg2(F.tr.gain)}</div></div><div><div class="h">2020년~ 경보 적중</div><div class="n">${F.te.prec}%</div><div class="s">기본 ${V.base.te}% · 초과 성과 ${sg2(F.te.gain)}</div></div></div>
 <div class="sec">해마다 초과 성과(무조건 매수 대비, 판단 1번당 %)</div>${yearBars(yrs.map(y=>[y,F.year[y]]))}
 <p class="sub">서울 ${sg2(F.sd['서울특별시'])} · 경기 ${sg2(F.sd['경기도'])} · 인천 ${sg2(F.sd['인천광역시'])}. 손실을 본 해는 2013·2018·2023년이고 작았어요. 충격형이 실제로 맞힌 하락은 2022년 한 번뿐이에요.</p></div>
 <div class="card"><div class="sec" style="margin-top:0">지표 하나씩 · 초과 성과 2012~2019 · 2020년~</div>
 ${V.single.map(s=>row(s.name,s.tr,s.te)).join('')}
 <p class="sub">같은 지표가 두 기간에 반대로 움직였어요. 금리 상승은 2012~2019년엔 보류가 손실(2017~18년 금리가 올라도 시세 상승), 2020년 이후엔 이익이었어요. 2012~13년 침체(저금리·수요 부진)와 2022년 금리 충격은 성격이 다른 하락이라, 두 유형을 따로 두고 둘 중 하나가 켜지면 보류해요.</p></div>
 <div class="card"><div class="sec" style="margin-top:0">유형별 경보 적중 · 2012~2019 · 2020년~</div>
 ${['충격형(국고채 급등+거래 급감)','침체형(매수우위 낮음+주담대 둔화)','충격형(금리 상승+거래 급감)'].map(k=>`<div class="gl"><span>${k}</span><span class="num">${TY[k].tr?TY[k].tr.prec:'-'}% · ${TY[k].te?TY[k].te.prec:'-'}%</span></div>`).join('')}
 <p class="sub">주담대 금리 대신 시장 금리(국고채 3년)를 쓰면 2017년 헛경보가 사라져요. 유형은 검색으로 고른 게 아니라 하락의 두 종류(충격·침체)로 미리 정했어요. 다만 지표를 하나씩 본 결과를 보고 정했으니 앞으로의 기록이 진짜 검증이에요.</p></div>`;}
function yearBars(Y){const W=340,H=150,n=Y.length,bw=(W-30)/n,mx=Math.max(...Y.map(v=>Math.abs(v[1])))||1,z=H/2,y=v=>z-v/mx*(H/2-22);
 let s=`<line x1="22" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)"/>`;Y.forEach(([yy,g],i)=>{const x0=24+i*bw;s+=`<rect x="${x0+bw*0.2}" y="${Math.min(z,y(g))}" width="${bw*0.6}" height="${Math.max(1,Math.abs(y(g)-z))}" rx="2" fill="${g>=0?'var(--green)':'var(--red)'}"/>`+
  `<text x="${x0+bw/2}" y="${H-3}" text-anchor="middle" font-size="9.5" fill="var(--ink3)">${yy.slice(2)}</text>`+(Math.abs(g)>=0.05?`<text x="${x0+bw/2}" y="${g>=0?y(g)-4:y(g)+11}" text-anchor="middle" font-size="8.5" fill="var(--ink3)">${g.toFixed(1)}</text>`:'');});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>`;}
// ---------- 급지 흐름 ----------
function tiers(nm){const T=D.TIER[nm],el=$('#v2'),col=['var(--blue)','var(--amber)','var(--ink3)'],lab=['상급지','중급지','하급지'],lab2=['상급','중급','하급'];
 const S=T.series,n=S['0'].length,all=[].concat(S['0'],S['1'],S['2']),lo=Math.min(...all)*0.95,hi=Math.max(...all)*1.03,W=340,H=200,x=i=>30+i/(n-1)*(W-40),y=v=>H-22-(v-lo)/(hi-lo)*(H-34);
 let yrs='';for(let yy=2010;yy<=2026;yy+=4){const i=yy*12-D.tstart;yrs+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink3)">${yy}</text>`;}
 const mv=T.moves, lg=T.lag;
 el.innerHTML=`<h1>급지 흐름</h1><p class="lead">같은 시·도 안에서 시세 순위로 상급·중급·하급 3등분(해마다 다시 나눔), 실거래 짝 비교 지수 · 2008.01=100</p>
 <div class="seg">${Object.keys(D.TIER).map(k=>`<button class="${k===nm?'on':''}" onclick="tiers('${k}')">${k}</button>`).join('')}</div>
 <div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${[0,1,2].map(t=>`<path d="${S[t].map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('')}" fill="none" stroke="${col[t]}" stroke-width="2"/>`).join('')}${yrs}</svg>
 <div class="lg">${[0,1,2].map(t=>`<span><i style="background:${col[t]}"></i>${lab[t]} ${Math.round(S[t][n-1])}</span>`).join('')}</div></div>
 <div class="card"><div class="sec" style="margin-top:0">고점·저점 시점과 폭</div>
 <div class="tw"><table class="tt"><thead><tr><th>구간</th>${lab2.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>
 ${mv.map(m=>`<tr><td>${m.from.replace(/년 (고점|저점)/,'')} → ${m.to.replace(/년 (고점|저점)/,'')}</td>${[0,1,2].map(t=>`<td class="${m.pct[t]>=0?'pos':'neg'}">${sg(m.pct[t])}${m.months?`<br><span class="sub">${m.months[t]}개월</span>`:''}</td>`).join('')}</tr>`).join('')}
 ${T.ep.map(e=>`<tr><td>${e.name}</td>${[0,1,2].map(t=>`<td>${e.t[t]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <p class="sub">6개월 변화 기준 상관: 중급지는 상급지보다 ${lg['1'].lag}개월, 하급지는 ${lg['2'].lag}개월 늦을 때 가장 비슷하게 움직였어요(상관 ${lg['2'].corr})</p></div>`;}
</script></body></html>
